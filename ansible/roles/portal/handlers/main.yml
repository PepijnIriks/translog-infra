- name: Restart translog-portal
  ansible.builtin.systemd:
    name: translog-portal
    state: restarted
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded

- name: Restart smbd
  ansible.builtin.systemd:
    name: smbd
    state: restarted
